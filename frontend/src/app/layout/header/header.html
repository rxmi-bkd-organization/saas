<header class="flex justify-between p-2 border-b-2 border-ink">
  <a [routerLink]="ROUTE_URLS.home">SaaS</a>

  <nav>
    <ul class="flex gap-6">

      @if (isAuthenticated()) {
        <li>
          <a [routerLink]="ROUTE_URLS.profile">{{ 'nav.profile' | transloco }}</a>
        </li>

        @if (isAdmin()) {
          <li>
            <a [routerLink]="ROUTE_URLS.admin">{{ 'nav.admin' | transloco }}</a>
          </li>
        }

        <li>
          <button type="button" (click)="logout()">{{ 'nav.logout' | transloco }}</button>
        </li>
      }

      @if(!isAuthenticated()) {
        <li>
          <a [routerLink]="ROUTE_URLS.signIn">{{ 'nav.signIn' | transloco }}</a>
        </li>
      }

      <li>
        <app-language-selector />
      </li>

    </ul>
  </nav>
</header>
