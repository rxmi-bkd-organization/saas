<app-form-container
  [form]="forgotPasswordForm"
  [heading]="'forgotPassword.header' | transloco"
  [submitLabel]="'forgotPassword.submit' | transloco"
>
  <app-form-field [field]="forgotPasswordForm.email" [label]="'label.email' | transloco" type="email" />
</app-form-container>

<a [routerLink]="ROUTE_URLS.signIn">{{ 'forgotPassword.backToSignIn' | transloco }}</a>
