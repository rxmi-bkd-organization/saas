<app-form-container
  [form]="updatePasswordForm"
  [heading]="'updatePassword.header' | transloco"
  [submitLabel]="'updatePassword.submit' | transloco"
>
  <app-form-field [field]="updatePasswordForm.oldPassword" [label]="'label.oldPassword' | transloco" type="password" />
  <app-form-field [field]="updatePasswordForm.newPassword" [label]="'label.newPassword' | transloco" type="password" />
</app-form-container>

@if (updated()) {
  <p role="status">{{ 'updatePassword.success' | transloco }}</p>
}
