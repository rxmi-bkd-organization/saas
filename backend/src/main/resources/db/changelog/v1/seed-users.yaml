databaseChangeLog:
  - changeSet:
      id: 1472064500760-1
      author: rxmi-bkd
      context: local
      changes:
        - insert:
            tableName: app_user
            columns:
              - column: { name: id, valueComputed: "'11111111-1111-1111-1111-111111111111'::uuid" }
              - column: { name: email, value: user@example.com }
              - column: { name: password, value: "$2a$10$2RTkA2SblGvqSgQ3x/mCxOb84iNbr3mPCreEI4xlP/ekiwTkmwYHi" } # user1234
              - column: { name: password_version, valueNumeric: 0 }
              - column: { name: role, value: ROLE_USER }
              - column: { name: created_at, valueComputed: now() }
              - column: { name: enabled, valueBoolean: true }
        - insert:
            tableName: app_user
            columns:
              - column: { name: id, valueComputed: "'22222222-2222-2222-2222-222222222222'::uuid" }
              - column: { name: email, value: admin@example.com }
              - column: { name: password, value: "$2a$10$YvmlAYbCPBbyIyoD.ez2cealg.wGdEfNHxnbzVMOUirApTXBIgW72" } # admin1234
              - column: { name: password_version, valueNumeric: 0 }
              - column: { name: role, value: ROLE_ADMIN }
              - column: { name: created_at, valueComputed: now() }
              - column: { name: enabled, valueBoolean: true }
      rollback:
        - delete:
            tableName: app_user
            where: email in ('user@example.com', 'admin@example.com')
