              - column:
                  constraints:
                    nullable: false
                  name: password_version
                  type: INT
              - column:
                  constraints:
                    nullable: false
                  name: role
                  type: VARCHAR(255)
              - column:
                  constraints:
                    nullable: false
                  name: created_at
                  type: DATETIME(6)
              - column:
                  constraints:
                    nullable: false
                  name: enabled
                  type: BOOLEAN
            tableName: app_user
  - changeSet:
      id: 1792069700150-2
      author: rxmi-bkd
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
