spring.application.name=saas

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.contexts=production

# JWT Configuration
app.jwt.reset-password-token.secret=${JWT_RESET_PASSWORD_TOKEN_SECRET}
app.jwt.reset-password-token.expiration=${JWT_RESET_PASSWORD_TOKEN_EXPIRATION}
app.jwt.activation-token.secret=${JWT_ACTIVATION_TOKEN_SECRET}
app.jwt.activation-token.expiration=${JWT_ACTIVATION_TOKEN_EXPIRATION}

# Frontend
app.frontend.base-url=${FRONTEND_BASE_URL}

# Rate limiting
app.security.rate-limit.enabled=true
app.security.rate-limit.bucket-max-size=50000

# Behind a reverse proxy: use X-Forwarded-* so the rate limiter sees the real client IP.
# The proxy MUST overwrite (not append to) X-Forwarded-For, otherwise clients can spoof their IP.
server.forward-headers-strategy=native

# Session cookie hardening
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# Actuator
management.server.port=8081
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Admin user seeding
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}