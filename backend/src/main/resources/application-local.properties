# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/saas
spring.datasource.username=postgres
spring.datasource.password=postgres

# Liquibase Configuration
spring.liquibase.contexts=local

# JWT Configuration
app.jwt.reset-password-token.secret=dev-only-reset-password-token-secret-change-me-0123456789
app.jwt.reset-password-token.expiration=300
app.jwt.activation-token.secret=dev-only-activation-token-secret-change-me-0123456789
app.jwt.activation-token.expiration=300

# Frontend
app.frontend.base-url=http://localhost:4200

# Rate limiting
app.security.rate-limit.enabled=false

# Session cookie hardening
server.servlet.session.cookie.secure=false

app.security.csrf.enabled=false

spring.docker.compose.file=compose.local.yml

app.admin.email=admin@example.com
app.admin.password=admin1234